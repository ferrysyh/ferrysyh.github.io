<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tampilkan data Google Sheet di web statis.">
  <meta name="color-scheme" content="light dark">
  <title>Sheet Viewer</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b;
      --border: #e2e8f0; --input-bg: #f8fafc;
      --primary: #2563eb; --primary-hover: #1d4ed8; --primary-text: #ffffff;
      --danger: #dc2626; --danger-bg: #fef2f2;
      --success: #059669; --success-bg: #ecfdf5;
      --warn: #b45309; --warn-bg: #fffbeb;
      --info: #0284c7; --info-bg: #f0f9ff;
      --ring: rgba(37,99,235,.18);
      --shadow: 0 1px 2px rgba(15,23,42,.05), 0 8px 24px -12px rgba(15,23,42,.12);
      --radius: 16px; --radius-sm: 10px;
    }
    [data-theme="dark"] {
      --bg: #09090b; --card: #111113; --text: #fafafa; --muted: #a1a1aa;
      --border: #27272a; --input-bg: #09090b;
      --primary: #3b82f6; --primary-hover: #60a5fa; --primary-text: #ffffff;
      --danger: #f87171; --danger-bg: rgba(248,113,113,.12);
      --success: #34d399; --success-bg: rgba(52,211,153,.12);
      --warn: #fbbf24; --warn-bg: rgba(180,83,9,.15);
      --info: #38bdf8; --info-bg: rgba(56,189,248,.12);
      --ring: rgba(59,130,246,.35);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.6);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: Inter, ui-sans-system, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.6; transition: background .25s, color .25s; -webkit-font-smoothing: antialiased; }
    .container { width: 100%; max-width: 1600px; margin: 0 auto; padding: 28px 24px 48px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .logo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
      background: var(--text); color: var(--bg); font-weight: 800; font-size: 17px; flex-shrink: 0; }
    .controls { display: flex; align-items: center; gap: 8px; }
    .seg { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
    .seg button { border: 0; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 700;
      padding: 6px 12px; border-radius: 999px; cursor: pointer; line-height: 1; }
    .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
    .icon-btn { width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); display: grid; place-items: center; cursor: pointer; font-size: 16px; }
    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none;
      font-size: 13.5px; font-weight: 600; margin-bottom: 12px; }
    .back:hover { color: var(--text); }
    .hero h1 { margin: 0; font-size: clamp(28px,4.5vw,38px); line-height: 1.1; letter-spacing: -1px; font-weight: 800; }
    .hero p { margin: 8px 0 0; color: var(--muted); font-size: 14px; max-width: 72ch; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px; margin-top: 16px; box-shadow: var(--shadow); }
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
    .duo .card { margin-top: 0; min-width: 0; }
    .card h2 { margin: 0; font-size: 16px; letter-spacing: -.2px; }
    .card-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 10px 0 4px; }
    input, select { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--input-bg); color: var(--text); font-size: 13.5px; }
    input { width: 100%; }
    select { cursor: pointer; }
    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--ring); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
    button.btn { height: 40px; padding: 0 16px; border: 1px solid transparent; border-radius: var(--radius-sm);
      background: var(--primary); color: var(--primary-text); font-weight: 650; font-size: 14px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
    button.btn:hover { background: var(--primary-hover); }
    button.btn.secondary { background: var(--card); color: var(--text); border-color: var(--border); }
    button.btn:disabled { opacity: .5; cursor: not-allowed; }
    button.btn:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
    .toolbar input[type="search"] { flex: 1; min-width: 200px; }
    .meta { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-top: 12px; max-height: 60vh; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 600px; }
    thead th { position: sticky; top: 0; background: var(--card); text-align: left; padding: 10px 12px;
      border-bottom: 2px solid var(--border); white-space: nowrap; }
    tbody td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
    tbody tr:hover td { background: var(--input-bg); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; }
    .stat { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--card); }
    .stat span { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted); }
    .stat b { font-size: 24px; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; font-size: 11.5px; font-weight: 800; padding: 2px 10px;
      border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
    .pill.ok { color: var(--success); background: var(--success-bg); }
    .pill.warn { color: var(--warn); background: var(--warn-bg); }
    .pill.bad { color: var(--danger); background: var(--danger-bg); }
    .pill.info { color: var(--info); background: var(--info-bg); }
    .pill.dim { color: var(--muted); }
    .bar { height: 8px; border-radius: 999px; background: var(--border); min-width: 90px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
    .bar.done i { background: var(--success); }
    .pct { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .mini { border: 0; background: transparent; color: var(--primary); font-size: 12.5px;
      font-weight: 700; cursor: pointer; padding: 2px 0; white-space: nowrap; }
    tr.detail td { background: var(--input-bg); font-size: 12.5px; }
    tr.detail pre { white-space: pre-wrap; margin: 4px 0 8px; font-family: inherit; font-size: 12.5px;
      background: transparent; border: 0; padding: 0; }
    tr.detail b.k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    .attn { display: grid; gap: 8px; margin-top: 12px; }
    .attn-item { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 9px 12px; cursor: pointer; background: var(--card); }
    .attn-item:hover { border-color: var(--primary); }
    .attn-item .grow { flex: 1; min-width: 0; }
    .attn-item strong { display: block; font-size: 13.5px; }
    .attn-item small { display: block; color: var(--muted); font-size: 12px; }
    .reasons { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .status { margin-top: 10px; font-size: 13.5px; color: var(--muted); min-height: 20px; overflow-wrap: anywhere; }
    .status.success { color: var(--success); font-weight: 600; }
    .status.error { color: var(--danger); font-weight: 600; background: var(--danger-bg);
      border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
    code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--input-bg);
      border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
    @media (max-width: 900px) {
      .duo { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .container { padding: 18px 16px 36px; } .card { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <a class="brand" href="./index.html">
        <div class="logo">&lt;/&gt;</div>
        <div><div style="font-weight:800;letter-spacing:-.3px;font-size:14px">All Tools</div></div>
      </a>
      <div class="controls">
        <div class="seg" role="group" aria-label="Language">
          <button type="button" id="langIdBtn" aria-pressed="true">ID</button>
          <button type="button" id="langEnBtn" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle theme">🌙</button>
      </div>
    </div>

    <a class="back" href="./index.html">← <span data-i18n="back">Beranda</span></a>
    <header class="hero">
      <h1 data-i18n="title">Sheet Viewer</h1>
    </header>

    <div class="duo">
      <section class="card" id="attnCard" hidden>
        <div class="card-head">
          <h2>⚠ Perlu Perhatian (<span id="attnCount">0</span>)</h2>
        </div>
        <div id="attnList" class="attn"></div>
      </section>

      <section class="card" id="progCard" hidden>
        <div class="card-head">
          <h2>▶ On Progress (<span id="progCount">0</span>)</h2>
        </div>
        <div id="progList" class="attn"></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="data_title">Data</h2>
        <p class="meta" id="meta">—</p>
      </div>
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <input type="search" id="search" placeholder="Cari…">
        <select id="statusFilter"><option value="">Semua status</option></select>
        <select id="taskFilter"><option value="">PT + VA</option></select>
        <button type="button" class="btn secondary" id="refreshBtn">↻ <span data-i18n="refresh">Refresh</span></button>
        <button type="button" class="btn secondary" id="dlBtn" disabled>⬇ CSV</button>
      </div>
      <div class="table-wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
      <div id="dataStatus" class="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    const MAX_ROWS = 2000;

    // Koneksi ditanam di kode — user tidak perlu setup.
    const SHEET_ID = "1rk9eou3IS836OLVtR0yNxBTgCrPlcX_elbNXRTKPPAY";
    const SHEET_NAME = "SUMMARY";

    const STR = {
      id: {
        back: "Beranda", title: "Sheet Viewer",
        data_title: "Data", refresh: "Refresh",
        err_fetch: "Gagal memuat. Cek koneksi internet lalu Refresh.",
        ok: (r, c) => `Berhasil memuat ${r} baris × ${c} kolom.`,
        meta: (r, c, t) => `${r} baris · ${c} kolom · dimuat ${t}`,
        noresult: "Tidak ada baris yang cocok dengan pencarian.",
        empty: "Belum ada data."
      },
      en: {
        back: "Home", title: "Sheet Viewer",
        data_title: "Data", refresh: "Refresh",
        err_fetch: "Failed to load. Check your connection, then Refresh.",
        ok: (r, c) => `Loaded ${r} rows × ${c} columns.`,
        meta: (r, c, t) => `${r} rows · ${c} columns · loaded ${t}`,
        noresult: "No rows match the search.",
        empty: "No data yet."
      }
    };
    let lang = localStorage.getItem("api-ext-lang") || "id";
    if (!STR[lang]) lang = "id";
    const t = (k) => STR[lang][k];

    function applyLang() {
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const k = el.getAttribute("data-i18n");
        if (STR[lang][k]) el.textContent = STR[lang][k];
      });
      $("search").placeholder = lang === "id" ? "Cari…" : "Search…";
      $("langIdBtn").setAttribute("aria-pressed", lang === "id");
      $("langEnBtn").setAttribute("aria-pressed", lang === "en");
      localStorage.setItem("api-ext-lang", lang);
    }
    function applyTheme(m) {
      document.documentElement.setAttribute("data-theme", m);
      $("themeToggle").textContent = m === "dark" ? "☀️" : "🌙";
      localStorage.setItem("api-ext-theme", m);
    }
    let theme = localStorage.getItem("api-ext-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    applyTheme(theme);
    $("themeToggle").onclick = () => {
      theme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(theme);
    };
    $("langIdBtn").onclick = () => { lang = "id"; applyLang(); renderMeta(); };
    $("langEnBtn").onclick = () => { lang = "en"; applyLang(); renderMeta(); };

    function setStatus(id, msg, type = "") {
      const el = $(id);
      el.textContent = msg;
      el.className = "status" + (type ? " " + type : "");
    }
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    let headers = [], rows = [], loadedAt = null;

    // Buang kolom kosong di trailing (sheet SUMMARY punya banyak kolom kosong M–AD).
    function trimTable(headers, rows) {
      let n = headers.length;
      while (n > 1) {
        const h = (headers[n - 1] || "").trim();
        const autoEmpty = h === "" || /^Kolom \d+$/.test(h);
        if (!autoEmpty) break;
        if (rows.some(r => String(r[n - 1] ?? "").trim() !== "")) break;
        n--;
      }
      return {
        headers: headers.slice(0, n),
        rows: rows.map(r => r.slice(0, n))
      };
    }

    function gvizJson(text) {
      const a = text.indexOf("{");
      const b = text.lastIndexOf("}");
      if (a < 0 || b < 0) throw new Error("bad gviz");
      return JSON.parse(text.slice(a, b + 1));
    }

    function parseGvizTable(json) {
      if (json.status === "error") throw new Error(json.errors?.[0]?.detailed_message || "gviz error");
      const cols = (json.table.cols || []).map((c, i) => (c.label || "").trim() || `Kolom ${i + 1}`);
      const out = (json.table.rows || []).map(r =>
        (r.c || []).map((cell) => {
          if (!cell) return "";
          if (cell.f !== undefined && cell.f !== null && cell.f !== "") return String(cell.f);
          return cell.v === null || cell.v === undefined ? "" : String(cell.v);
        }).slice(0, cols.length));
      // buang baris kosong total
      return { headers: cols, rows: out.filter(r => r.some(v => String(v).trim() !== "")) };
    }

    async function fetchGviz(id, gid, sheet) {
      let url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&headers=1`;
      if (sheet) url += `&sheet=${encodeURIComponent(sheet)}`;
      else if (gid) url += `&gid=${encodeURIComponent(gid)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("gviz " + res.status);
      return parseGvizTable(gvizJson(await res.text()));
    }

    // Fallback tanpa CORS via <script> (JSONP-style). Tidak butuh CORS.
    function fetchGvizJsonp(id, gid, sheet, timeoutMs = 15000) {
      return new Promise((resolve, reject) => {
        let url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&headers=1`;
        if (sheet) url += `&sheet=${encodeURIComponent(sheet)}`;
        else if (gid) url += `&gid=${encodeURIComponent(gid)}`;
        url += `&t=${Date.now()}`;
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("jsonp timeout"));
        }, timeoutMs);
        function cleanup() {
          clearTimeout(timer);
          script.remove();
          if (window.google?.visualization?.Query) {
            delete window.google.visualization.Query.setResponse;
          }
        }
        window.google = window.google || {};
        window.google.visualization = window.google.visualization || {};
        window.google.visualization.Query = window.google.visualization.Query || {};
        window.google.visualization.Query.setResponse = (json) => {
          try { resolve(parseGvizTable(json)); }
          catch (e) { reject(e); }
          finally { cleanup(); }
        };
        script.onerror = () => { cleanup(); reject(new Error("jsonp load error")); };
        script.src = url;
        document.head.appendChild(script);
      });
    }

    function parseCsv(text) {
      const out = [];
      let row = [], cur = "", q = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) {
          if (c === '"') {
            if (text[i + 1] === '"') { cur += '"'; i++; }
            else q = false;
          } else cur += c;
        } else if (c === '"') q = true;
        else if (c === ",") { row.push(cur); cur = ""; }
        else if (c === "\n" || c === "\r") {
          if (c === "\r" && text[i + 1] === "\n") i++;
          row.push(cur); cur = "";
          if (row.length > 1 || row[0] !== "") out.push(row);
          row = [];
        } else cur += c;
      }
      row.push(cur);
      if (row.length > 1 || row[0] !== "") out.push(row);
      if (!out.length) return { headers: [], rows: [] };
      return { headers: out[0].map((h, i) => h.trim() || `Kolom ${i + 1}`), rows: out.slice(1) };
    }

    async function fetchCsv(id, gid) {
      let url = `https://docs.google.com/spreadsheets/d/${id}/export?format=csv`;
      if (gid) url += `&gid=${encodeURIComponent(gid)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("csv " + res.status);
      return parseCsv(await res.text());
    }

    async function loadData() {
      setStatus("dataStatus", lang === "id" ? "Memuat…" : "Loading…");
      $("refreshBtn").disabled = true;
      try {
        let data, e1 = "", e2 = "", e3 = "";
        try { data = await fetchGviz(SHEET_ID, "", SHEET_NAME); }
        catch (e) { e1 = e.message || String(e); }
        if (!data || !data.headers.length) {
          try { data = await fetchCsv(SHEET_ID, ""); }
          catch (e) { e2 = e.message || String(e); }
        }
        if (!data || !data.headers.length) {
          try { data = await fetchGvizJsonp(SHEET_ID, "", SHEET_NAME); }
          catch (e) { e3 = e.message || String(e); }
        }
        if (!data || !data.headers.length) {
          const detail = [e1, e2, e3].filter(Boolean).join(" | ") || "unknown";
          throw new Error(detail);
        }
        const clean = trimTable(data.headers, data.rows);
        headers = clean.headers;
        rows = clean.rows.slice(0, MAX_ROWS);
        loadedAt = new Date();
        openDetail.clear();
        resolveCols();
        renderStats();
        renderFilters();
        renderAttention();
        renderProg();
        renderTable();
        renderMeta();
        setStatus("dataStatus", rows.length ? t("ok")(rows.length, headers.length) : t("empty"), rows.length ? "success" : "");
        $("dlBtn").disabled = !rows.length;
      } catch (e) {
        const detail = e.message || String(e);
        setStatus("dataStatus", `${t("err_fetch")} (${detail})`, "error");
      } finally { $("refreshBtn").disabled = false; }
    }

    // Peta kolom berdasarkan nama header (tahan terhadap urutan berubah).
    let CI = {};
    function resolveCols() {
      const H = headers.map(h => h.toLowerCase().trim());
      const find = (...names) => {
        for (const n of names) {
          const i = H.indexOf(n);
          if (i >= 0) return i;
        }
        return -1;
      };
      CI = {
        no: find("no"),
        task: find("task"),
        type: find("type"),
        name: find("task name", "taskname", "name"),
        start: find("start date", "start"),
        end: find("end date", "end"),
        status: find("status"),
        progress: find("progress"),
        daily: find("daily status", "daily"),
        note: find("note"),
        event: find("event id"),
        log: find("log")
      };
    }

    function statusPill(s) {
      const v = String(s || "").trim().toLowerCase();
      if (v === "complete") return `<span class="pill ok">Complete</span>`;
      if (v === "on progress") return `<span class="pill info">On Progress</span>`;
      if (v === "not started") return `<span class="pill dim">Not Started</span>`;
      if (v === "issue") return `<span class="pill bad">Issue</span>`;
      if (v.includes("cancel")) return `<span class="pill dim">${esc(s)}</span>`;
      if (v.includes("hold")) return `<span class="pill warn">${esc(s)}</span>`;
      return `<span class="pill dim">${esc(s || "-")}</span>`;
    }

    function progressCell(p) {
      const num = parseFloat(String(p).replace("%", "").replace(",", "."));
      const pct = isNaN(num) ? 0 : Math.max(0, Math.min(100, num > 1 ? num : num * 100));
      const done = pct >= 100 ? " done" : "";
      return `<div class="bar${done}"><i style="width:${pct}%"></i></div> <span class="pct">${esc(String(p || "0%"))}</span>`;
    }

    function filteredRows() {
      const q = $("search").value.trim().toLowerCase();
      const fs = $("statusFilter").value;
      const ft = $("taskFilter").value;
      return rows.filter((r, idx) => {
        if (fs && String(r[CI.status] ?? "").trim().toLowerCase() !== fs) return false;
        if (ft && String(r[CI.task] ?? "").trim().toLowerCase() !== ft) return false;
        if (q && !r.some(v => String(v).toLowerCase().includes(q))) return false;
        r._idx = idx;
        return true;
      });
    }

    function renderStats() {
      const el = $("stats");
      if (!rows.length) { el.innerHTML = ""; return; }
      const count = (fn) => rows.filter(fn).length;
      const st = (s) => count(r => String(r[CI.status] ?? "").trim().toLowerCase() === s);
      const complete = st("complete"), progress = st("on progress"),
        notstart = st("not started"), issue = st("issue");
      const pt = count(r => String(r[CI.task] ?? "").trim().toLowerCase() === "pt");
      const va = count(r => String(r[CI.task] ?? "").trim().toLowerCase() === "va");
      // Status lain di luar 5 utama (mis. Hold/Canceled) ikut jadi kartu otomatis.
      const known = ["complete", "on progress", "not started", "issue"];
      const extra = {};
      rows.forEach(r => {
        const raw = String(r[CI.status] ?? "").trim();
        if (!raw || known.includes(raw.toLowerCase())) return;
        extra[raw] = (extra[raw] || 0) + 1;
      });
      const L = lang === "id"
        ? { total: "Total", done: "Complete", prog: "On Progress", ns: "Not Started", iss: "Issue", pt: "PT", va: "VA" }
        : { total: "Total", done: "Complete", prog: "On Progress", ns: "Not Started", iss: "Issue", pt: "PT", va: "VA" };
      el.innerHTML = [
        [L.total, rows.length], [L.done, complete], [L.prog, progress],
        [L.ns, notstart], [L.iss, issue], [L.pt, pt], [L.va, va],
        ...Object.entries(extra).sort((a, b) => b[1] - a[1])
      ].map(([label, n]) => `<div class="stat"><span>${esc(label)}</span><b>${n.toLocaleString()}</b></div>`).join("");
    }

    function renderFilters() {
      const keepS = $("statusFilter").value, keepT = $("taskFilter").value;
      const uniq = (i) => [...new Set(rows.map(r => String(r[i] ?? "").trim()).filter(Boolean))].sort();
      const allS = lang === "id" ? "Semua status" : "All statuses";
      const allT = "PT + VA";
      $("statusFilter").innerHTML = `<option value="">${allS}</option>` +
        uniq(CI.status).map(s => `<option value="${esc(s.toLowerCase())}">${esc(s)}</option>`).join("");
      $("taskFilter").innerHTML = `<option value="">${allT}</option>` +
        uniq(CI.task).map(s => `<option value="${esc(s.toLowerCase())}">${esc(s)}</option>`).join("");
      if ([...$("statusFilter").options].some(o => o.value === keepS)) $("statusFilter").value = keepS;
      if ([...$("taskFilter").options].some(o => o.value === keepT)) $("taskFilter").value = keepT;
    }

    function parseDate(v) {
      const s = String(v ?? "").trim();
      if (!s || s === "-") return null;
      const d = new Date(s);
      return isNaN(d) ? null : d;
    }

    function renderAttention() {
      const card = $("attnCard"), list = $("attnList");
      if (!rows.length) { card.hidden = true; return; }
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const out = [];
      rows.forEach((r, idx) => {
        const reasons = [];
        const st = String(r[CI.status] ?? "").trim();
        const stL = st.toLowerCase();
        if (stL === "issue") reasons.push(["bad", "Issue"]);
        const end = parseDate(r[CI.end]);
        // Canceled dianggap selesai (tidak nagih overdue); Hold tetap diawasi via filter.
        if (end && end < today && stL !== "complete" && !stL.includes("cancel")) reasons.push(["warn", "Overdue"]);
        if (String(r[CI.daily] ?? "").trim().toLowerCase() === "unreported") reasons.push(["info", "Unreported"]);
        if (reasons.length) {
          const sev = stL === "issue" ? 0 : reasons.some(x => x[1] === "Overdue") ? 1 : 2;
          out.push({ idx, name: r[CI.name], st, end: r[CI.end], reasons, sev });
        }
      });
      out.sort((a, b) => a.sev - b.sev);
      card.hidden = !out.length;
      $("attnCount").textContent = out.length;
      list.innerHTML = out.map(o => `<div class="attn-item" data-jump="${o.idx}" role="button" tabindex="0">
        <span class="grow"><strong>${esc(o.name || "-")}</strong>
        <small>${esc(o.st)}${o.end ? " · s.d. " + esc(o.end) : ""}</small></span>
        <span class="reasons">${o.reasons.map(([c, x]) => `<span class="pill ${c}">${x}</span>`).join("")}</span>
      </div>`).join("");
    }

    function renderProg() {
      const card = $("progCard"), list = $("progList");
      const out = [];
      rows.forEach((r, idx) => {
        if (String(r[CI.status] ?? "").trim().toLowerCase() !== "on progress") return;
        const sched = [r[CI.start], r[CI.end]].map(v => String(v ?? "").trim()).filter(Boolean).join(" → ");
        out.push({ idx, name: r[CI.name], sched, prog: r[CI.progress] });
      });
      card.hidden = !out.length;
      $("progCount").textContent = out.length;
      list.innerHTML = out.map(o => `<div class="attn-item" data-jump="${o.idx}" role="button" tabindex="0">
        <span class="grow"><strong>${esc(o.name || "-")}</strong>
        <small>${esc(o.sched || "-")}</small></span>
        <span class="pct">${esc(String(o.prog || "0%"))}</span>
      </div>`).join("");
    }

    const openDetail = new Set();
    function renderTable() {
      const head = $("tbl").querySelector("thead");
      const body = $("tbl").querySelector("tbody");
      const L = lang === "id"
        ? ["No", "Task", "Jadwal", "Status", "Progress", "Harian", ""]
        : ["No", "Task", "Schedule", "Status", "Progress", "Daily", ""];
      head.innerHTML = "<tr>" + L.map(h => `<th>${h}</th>`).join("") + "</tr>";
      const fr = filteredRows();
      body.innerHTML = fr.map((r) => {
        const i = r._idx;
        const sched = [r[CI.start], r[CI.end]].map(v => String(v ?? "").trim()).filter(Boolean).join(" → ") || "-";
        const hasDetail = [r[CI.note], r[CI.event], r[CI.log]].some(v => String(v ?? "").trim() !== "");
        let html = `<tr>
          <td style="white-space:nowrap;color:var(--muted)">${esc(r[CI.no] ?? "")}</td>
          <td><b>${esc(r[CI.name] ?? "-")}</b><br>
            <span class="pill dim">${esc(r[CI.task] ?? "")}${r[CI.type] && r[CI.type] !== "-" ? " · " + esc(r[CI.type]) : ""}</span></td>
          <td style="white-space:nowrap">${esc(sched)}</td>
          <td>${statusPill(r[CI.status])}</td>
          <td style="white-space:nowrap">${progressCell(r[CI.progress])}</td>
          <td>${esc(r[CI.daily] ?? "-")}</td>
          <td>${hasDetail ? `<button type="button" class="mini" data-detail="${i}">${openDetail.has(i) ? "▲" : "▼"} detail</button>` : ""}</td>
        </tr>`;
        if (hasDetail && openDetail.has(i)) {
          const parts = [];
          if (String(r[CI.note] ?? "").trim()) parts.push(`<b class="k">Note</b><pre>${esc(r[CI.note])}</pre>`);
          if (String(r[CI.event] ?? "").trim()) parts.push(`<b class="k">Event ID</b><pre>${esc(r[CI.event])}</pre>`);
          if (String(r[CI.log] ?? "").trim()) parts.push(`<b class="k">Log</b><pre>${esc(r[CI.log])}</pre>`);
          html += `<tr class="detail"><td></td><td colspan="6">${parts.join("")}</td></tr>`;
        }
        return html;
      }).join("");
      if (!fr.length && rows.length) setStatus("dataStatus", t("noresult"));
      else if (rows.length) setStatus("dataStatus", "");
    }

    function renderMeta() {
      $("meta").textContent = rows.length
        ? t("meta")(rows.length, headers.length, loadedAt ? loadedAt.toLocaleString() : "-")
        : "—";
    }

    function toCsv(list) {
      const q = (v) => /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
      return [headers, ...list].map(r => headers.map((_, i) => q(String(r[i] ?? ""))).join(",")).join("\n");
    }

    (function init() {
      applyLang();
      renderMeta();
      loadData();
    })();

    $("refreshBtn").onclick = loadData;
    $("search").addEventListener("input", renderTable);
    $("statusFilter").addEventListener("change", renderTable);
    $("taskFilter").addEventListener("change", renderTable);
    $("tbl").addEventListener("click", (e) => {
      const b = e.target.closest("[data-detail]");
      if (!b) return;
      const i = Number(b.dataset.detail);
      if (openDetail.has(i)) openDetail.delete(i);
      else openDetail.add(i);
      renderTable();
    });
    function jumpTo(i) {
      const r = rows[i];
      if (!r) return;
      $("statusFilter").value = "";
      $("taskFilter").value = "";
      $("search").value = String(r[CI.name] ?? "");
      renderTable();
      $("tbl").scrollIntoView({ behavior: "smooth", block: "start" });
    }
    $("attnList").addEventListener("click", (e) => {
      const item = e.target.closest("[data-jump]");
      if (!item) return;
      jumpTo(Number(item.dataset.jump));
    });
    $("progList").addEventListener("click", (e) => {
      const item = e.target.closest("[data-jump]");
      if (!item) return;
      jumpTo(Number(item.dataset.jump));
    });
    $("dlBtn").onclick = () => {
      const csv = toCsv(filteredRows());
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "sheet_data.csv";
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(a.href);
    };
  </script>
</body>
</html>
